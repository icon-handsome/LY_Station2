[Measurement]
base_fit_length_mm=10.0
# 焊趾外母材评价区终点距离；直焊缝在该区间内参与固定圆拟合和偏差评价。
angularity_evaluation_length_mm=50.0
# 直焊缝的理论圆直径，圆拟合中固定该直径，仅优化圆心。
angularity_reference_diameter_mm=1200.0
# 单截面母材轮廓偏差中值滤波窗口。
angularity_profile_median_filter_window=5
meas_result_median_filter_window=5

[Undercut]
depth_threshold_mm=0.50
median_filter_window=3
toe_search_width_mm=2.0
base_fit_start_from_toe_mm=2.0
base_fit_end_from_toe_mm=15.0
min_groove_width_mm=0.5
min_groove_points=3

[ONNX]
enabled=true
model_path=../../models/weld_measure/pointnet_weld_seam_V8.2_good.onnx
input_feature_name=input_15d_features
output_name=output_segmentation
target_point_count=512
median_filter_window=15
detrend_filter_window=45
fixed_physical_scale_mm=150.0
slope_radius_mm=1.0
fine_curvature_radius_mm=2.5
macro_curvature_radius_mm=6.0
continuity_window=7
toe_median_filter_window=7
seam_class_id=1
num_classes=3
min_seam_points=3

[Input]
frame_count=7
# The scan frame number that uses TemplateFirst.注意：起始帧号从1开始的，不是从0开始的
first_template_frame=1
# The frame number that uses TemplateLast. Frame1 uses TemplateFirst; all other frames use TemplateMiddle.
last_template_frame=7
# 点云ROI裁剪，务必加上，否则模板匹配极慢
roi_enabled=true
roi_min=(-10000.0,-10000.0, -10000.0)
roi_max=(10000.0, 10000.0, 10000.0)
# false保持原有直焊缝截面逻辑
# true：环焊缝使用模板圆柱 axis、圆心和截面起点，沿圆周按 section_dist 生成截面中心；截面方向使用圆周切线。
is_ring_weld=false

# Configure only three templates. Vectors must use the format (x,y,z).
# first_template_frame uses TemplateFirst, last_template_frame uses TemplateLast, and all other frames use TemplateMiddle.
[TemplateFirst]
template_pcd_path=Data/path1/Template_Path1_Telescopic_cloud_1.pcd
axis=(-0.9993,0.0099,-0.0354)
center=(245.2336,-60.3816,-56.5169)
section_dist=2.0
section_width=1.0
section_leng=200.0
section_height=100.0
# 截面区间两端向内偏移距离（毫米）
section_endpoint_inner_offset_mm=15.0
# 环焊缝截面圆周角度步进（角度）
section_angle_step_deg=1.0
# 环焊缝圆柱面投影的半径容差（毫米）
# 环焊缝圆周角度分桶的最少有效点数
ring_coverage_min_points_per_bin=3
start_sec=(-287.3047,16.8570,508.6308)
end_sec=(221.8584,11.4472,526.4359)

[TemplateMiddle]
template_pcd_path=Data/path1/Template_Path1_Telescopic_cloud_4.pcd
axis = (-0.9993,0.0101,-0.0355)
center = (244.8971,-60.5478,-64.3553)
section_dist=2.0
section_width=1.0
section_leng=200.0
section_height=100.0
# 截面区间两端向内偏移距离（毫米）
section_endpoint_inner_offset_mm=15.0
# 环焊缝截面圆周角度步进（角度）
section_angle_step_deg=1.0
# 环焊缝圆周角度分桶的最少有效点数
ring_coverage_min_points_per_bin=3
start_sec = (221.2663,9.9735,521.7745)
end_sec = (-284.4616,16.2487,503.5976)

[TemplateLast]
template_pcd_path=Data/path1/Template_Path1_Telescopic_cloud_7.pcd
axis=(-0.9993,0.0132,-0.0354)
center=(241.2171,-59.1926,-57.3472)
section_dist=2.0
section_width=1.0
section_leng=200.0
section_height=100.0
# 截面区间两端向内偏移距离（毫米）
section_endpoint_inner_offset_mm=15.0
# 环焊缝截面圆周角度步进（度）
section_angle_step_deg=1.0
# 环焊缝圆柱面投影的半径容差（毫米）
# 环焊缝圆周角度分桶的最少有效点数
ring_coverage_min_points_per_bin=3
start_sec=(222.1438,9.9310,519.5475)
end_sec=(-6.4243,8.8981,512.5299)

