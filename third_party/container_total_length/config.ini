// 容器总长测量配置。
// 该工程只使用 outsideScan 端点检测方法。

[Input]
inputCloud = ./Data/Scan_Path3_Arm_All_Samp.pcd
// 如需先裁剪输入点云，可打开该开关(true/false)。
cropInputCloud = true
cropMin = -100000, -100000, -100000
cropMax = 100000, 100000, 100000

[Template]
templateCloud = ./Data/Template_Path3_Arm_All_Samp.pcd
// 模板中的圆柱轴线初值。
axisDirection = -0.9973, -0.0582, -0.0447

[Preprocess]
voxelSize = 2.0
// outlierK <= 1 时关闭统计离群点过滤。
outlierK = 1
outlierStd = 5.0

[ICP]
maxIterations = 80
maxCorrespondenceDistance = 100.0
transformationEpsilon = 1e-8
euclideanFitnessEpsilon = 1e-6

[CylinderFit]
// 该工程使用全部点云拟合圆柱轴线/半径，端点只走 outsideScan。
updateAxis = false
iterations = 3
// <= 0 时使用自动带宽。
inlierBand = 0

[LengthMeasurement]
// 端点检测方法固定为 outsideScan。
endpointDetectionMethod = outsideScan

// 端点投影参数。
axialBinWidth = 2.0
// outsideScan 的端点分位数，0.0001 表示左右两端各取 0.01% / 99.99%。
refineEdgePercentile = 0.0002
// outsideScan 中，首次找到有效边界后向内继续搜索的窗口宽度。
outsideScanPeakSearchWidth = 20.0
// 每个 bin 的最小点数。
minPointsPerBin = 5
// 满足最小点数的连续 bin 数。
minConsecutiveInsideBins = 3
// 候选边界外侧需要检查的空 bin 数。
outsideCheckBins = 2

