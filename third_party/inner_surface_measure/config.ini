// Inner surface measurement config. The program requires exactly two frames.

[CylinderTemplate]
templateCloud = ./Data/sample_cylinder.pcd
point = 0, 0, 0
axis = 0, 0, 1
radius = 600

[InputFrames]
// Format: frameN = cloud.pcd
// Both clouds are measured independently without an R/t transformation.
frame1 = ./Data/sample_cylinder_cut_1.pcd
frame2 = ./Data/sample_cylinder_cut_2.pcd

[Preprocess]
voxelSize = 1.0
outlierK = 10
outlierStd = 3.0

[Algorithm]
fitIterations = 5
cylinderInlierBand = 0
// Points within sectionHalfWidth on either side of each section are selected.
// Therefore, the total axial width used by a section is 2 * sectionHalfWidth.
sectionHalfWidth = 2.0

// ICP: each input cloud is the source and the template cloud is the target.
icpMaxIterations = 100
icpMaxCorrespondenceDistance = 100
icpTransformationEpsilon = 1e-8
icpEuclideanFitnessEpsilon = 1e-6
