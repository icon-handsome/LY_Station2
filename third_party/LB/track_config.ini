# 极线匹配和三维重建约束
# epipolar_threshold = 2.5
epipolar_threshold = 25.0
min_z_range = 1000.0
max_z_range = 7000.0
max_reproj_err = 55.5
max_ratio = 0.7

[Detector]
# 标记点检测参数
pyramid_levels = 1
min_area = 100
max_area = 7000
ROI_w = 800
ROI_h = 800
# perim_t = perimeter_radius_px / pow(2, level_cnt) * 6.28
perimeter_radius_px = 5.0
# 同一标记候选的抑制半径。该值应小于标记点最小投影间距。
duplicate_exclusion_radius_px = 30.0
# 越接近 1 越圆，工业标记点通常 > 0.8
min_circularity = 0.75
# 中心点亮度阈值
intensity_threshold = 50
# DBSCAN 最少点数
debscan_min_pts = 5

[Limits]
# 原宏参数，改为运行时配置
mark_point_size_max = 150
debscan_filter_dist_max = 300.0
vote_pnt_size_max = 40
vote_filter_pnt_size_min = 4
# 三维重建点邻域筛选：max_distance范围内至少有多少个邻居
recon_neighbor_count_min = 3
# 位姿RANSAC：模板点经Rt对齐到重建点后，小于该距离视为内点，单位mm
pose_ransac_inlier_dist = 1.0
# 位姿RANSAC随机采样次数；程序使用固定种子，保证同一输入结果一致
pose_ransac_iterations = 200
