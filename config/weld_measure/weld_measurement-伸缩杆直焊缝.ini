[Frame4]
scan_pcd_path=Data/path1/Scan_Path1_Telescopic_cloud_4.pcd
[Frame5]
scan_pcd_path=Data/path1/Scan_Path1_Telescopic_cloud_5.pcd
[Frame6]
scan_pcd_path=Data/path1/Scan_Path1_Telescopic_cloud_6.pcd
[Frame7]
scan_pcd_path=Data/path1/Scan_Path1_Telescopic_cloud_7.pcd

[ICP]
voxel_leaf_size_mm=1.0
max_correspondence_distance_mm=100.0
maximum_iterations=100
