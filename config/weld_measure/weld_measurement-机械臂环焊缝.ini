[Measurement]
base_fit_length_mm=50.0
# 焊趾外母材评价区终点距离；环焊缝在该区间内进行母材基准评价。
angularity_evaluation_length_mm=50.0
# 直焊缝专用的理论圆直径；环焊缝不使用此参数。
angularity_reference_diameter_mm=1200.0
# 单截面母材轮廓偏差中值滤波窗口。
angularity_profile_median_filter_window=5
meas_result_median_filter_window=5

[Undercut]
depth_threshold_mm=0.50
median_filter_window=3
toe_search_width_mm=2.0
base_fit_start_from_toe_mm=2.0
base_fit_end_from_toe_mm=15.0
min_groove_width_mm=0.5
min_groove_points=3

[ONNX]
enabled=true
model_path=../../models/weld_measure/pointnet_weld_seam_V8.2_good.onnx
input_feature_name=input_15d_features
output_name=output_segmentation
target_point_count=512
median_filter_window=15
detrend_filter_window=45
fixed_physical_scale_mm=150.0
slope_radius_mm=1.0
fine_curvature_radius_mm=2.5
macro_curvature_radius_mm=6.0
continuity_window=7
toe_median_filter_window=7
seam_class_id=1
num_classes=3
min_seam_points=3

[Input]
frame_count=18
# The scan frame number that uses TemplateFirst.注意：起始帧号从1开始的，不是从0开始的
first_template_frame=1
# The frame number that uses TemplateLast. Frame1 uses TemplateFirst; all other frames use TemplateMiddle.
last_template_frame=18
# 点云ROI裁剪，务必加上，否则模板匹配极慢
roi_enabled=true
roi_min=(-240.8461, -130.7420, 338.1898)
roi_max=(139.4069, 15.5850, 397.5682)
# false保持原有直焊缝截面逻辑
# true：环焊缝使用模板圆柱 axis、圆心和截面起点，沿圆周按 section_dist 生成截面中心；截面方向使用圆周切线。
is_ring_weld=true

# Configure only three templates. Vectors must use the format (x,y,z).
# first_template_frame uses TemplateFirst, last_template_frame uses TemplateLast, and all other frames use TemplateMiddle.
[TemplateFirst]
template_pcd_path=Data/path5/Template_Path5_Arm_cloud_18.pcd
axis=(-0.0171, -0.9967, -0.0798)
center=(-89.4485, 90.5358, 998.0463)
section_dist=2.0
section_width=1.0
section_leng=200.0
section_height=100.0
# 截面区间两端向内偏移距离（毫米）
section_endpoint_inner_offset_mm=15.0
# 环焊缝截面圆周角度步进（角度）,0.2度在600mm半径下相当于2mm间隔
section_angle_step_deg=0.2
# 环焊缝覆盖检测的角度分桶大小（度）
ring_coverage_bin_angle_deg=10.0
# 环焊缝圆周角度分桶的最少有效点数
