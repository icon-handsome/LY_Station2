// 筒体总长测量配置（path3）。端点检测只使用 outsideScan。
// 模板 PCD 现场替换 Data/sample_cylinder.pcd；相对路径相对本 INI 所在目录。

[Input]
// DLL 内存入口忽略 inputCloud，扫描点云由 IPC 合并后传入。
inputCloud =
cropInputCloud = false
cropMin = -100000, -100000, -100000
cropMax = 100000, 100000, 100000

[Template]
templateCloud = ./Data/sample_cylinder.pcd
axisDirection = -0.9973, -0.0582, -0.0447

[Preprocess]
voxelSize = 2.0
// outlierK <= 1 时关闭统计离群点过滤。
outlierK = 1
outlierStd = 5.0

[ICP]
maxIterations = 80
maxCorrespondenceDistance = 100.0
transformationEpsilon = 1e-8
euclideanFitnessEpsilon = 1e-6

[CylinderFit]
updateAxis = false
iterations = 3
inlierBand = 0

[LengthMeasurement]
endpointDetectionMethod = outsideScan
axialBinWidth = 2.0
refineEdgePercentile = 0.0002
outsideScanPeakSearchWidth = 20.0
minPointsPerBin = 5
minConsecutiveInsideBins = 3
outsideCheckBins = 2
refineHalfWidth = 6.0
