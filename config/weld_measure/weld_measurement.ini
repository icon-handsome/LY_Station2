[Measurement]
base_fit_length_mm=50.0
# 焊趾外母材评价区终点距离；直焊缝在该区间内参与固定圆拟合和偏差评价。
angularity_evaluation_length_mm=50.0
# 直焊缝的理论圆直径，圆拟合中固定该直径，仅优化圆心。
angularity_reference_diameter_mm=1200.0
# 单截面母材轮廓偏差中值滤波窗口。
angularity_profile_median_filter_window=5
meas_result_median_filter_window=5

[Undercut]
depth_threshold_mm=0.50
# 咬边长度中值滤波
median_filter_window=3
toe_search_width_mm=2.0
base_fit_start_from_toe_mm=2.0
base_fit_end_from_toe_mm=15.0
min_groove_width_mm=0.5
min_groove_points=3

[ONNX]
enabled=true
model_path=../../models/weld_measure/pointnet_weld_seam_V8.2_good.onnx
input_feature_name=input_15d_features
output_name=output_segmentation
target_point_count=512
median_filter_window=15
detrend_filter_window=45
fixed_physical_scale_mm=150.0
slope_radius_mm=1.0
fine_curvature_radius_mm=2.5
macro_curvature_radius_mm=6.0
# 焊缝分类结果的连续性后处理窗口，单位是点数
# 表示对每个点，查看它前后3 个点加自身共 7 个点，采用多数投票重新确定类别。之后只保留最长的连续焊缝类别区段，去除零散误识别点。
continuity_window=7
# 当前点云所有焊趾点中值滤波窗口
toe_median_filter_window=7
seam_class_id=1
num_classes=3
min_seam_points=3

[Input]
frame_count=12
# 注意：起始帧号从1开始的，不是从0开始的
first_template_frame=1
last_template_frame=9
# 点云ROI裁剪，务必加上，否则模板匹配极慢
roi_enabled=true
roi_min=(-10000.0,-10000.0, -10000.0)
roi_max=(10000.0, 10000.0, 10000.0)
# false保持原有直焊缝截面逻辑
# true：环焊缝使用模板圆柱 axis、圆心和截面起点，沿圆周按 section_dist 生成截面中心；截面方向使用圆周切线。
is_ring_weld=false

[TemplateFirst]
template_pcd_path=Data/path1/Template_Path1_Arm_cloud_1.pcd
axis=(0.0066,1.0000,0.0043)
center=(-44.6308,-139.5216,962.1691 )
section_dist=2.0
section_width=1.0
section_leng=200.0
section_height=100.0
# 截面区间两端向内偏移距离（毫米）
section_endpoint_inner_offset_mm=15.0
# 环焊缝截面圆周角度步进（角度）
section_angle_step_deg=1.0
# 环焊缝圆柱面投影的半径容差（毫米）
# 环焊缝圆周角度分桶的最少有效点数
ring_coverage_min_points_per_bin=3
start_sec=(-36.981697,-17.873583,357.663788)
end_sec=(-39.749207,-122.211945,357.149841)

