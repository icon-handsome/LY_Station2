// 容器总长测量配置（V2.3）。
// 端点检测：outsideScan，外侧向内固定点数栅格。

[Input]
inputCloud = ./Data/Path3_Arm_cloud_stitched_1.pcd
// 如需先裁剪输入点云，可打开该开关(true/false)。
cropInputCloud = true
cropMin = -1399.917, -1169.093, 3181.6795
cropMax = 1021.583, -563.013, 3507.2205

[Template]
templateCloud = ./Data/Template_Path3_Arm_All_Samp_20260914.pcd
// 模板中的圆柱轴线初值。
axisDirection = -0.9973, -0.0582, -0.0447

[Preprocess]
voxelSize = 1.0
// outlierK <= 1 时关闭统计离群点过滤。
outlierK = 1
outlierStd = 5.0

[ICP]
maxIterations = 80
maxCorrespondenceDistance = 100.0
transformationEpsilon = 1e-8
euclideanFitnessEpsilon = 1e-6

[CylinderFit]
updateAxis = false
iterations = 3
// <= 0 时使用自动带宽。
inlierBand = 0

[LengthMeasurement]
endpointDetectionMethod = outsideScan

// 端点投影栅格参数：从投影最外侧向内搜索。
axialBinWidth = 0.3
endpointSearchRange = 12.0
endpointMinPoints = 200
