# 光学双目跟踪测试配置文件
# 编码：UTF-8 with BOM。请保持 UTF-8 BOM，避免中文路径或中文注释乱码。
# 矩阵可以按行填写，数字可以用逗号或空格分隔。

[Paths]
# 离线回放用；在线 CXP 采集不依赖这两项。路径末尾需 /*.bmp
; left_images = data/LB/L/*.bmp
; right_images = data/LB/R/*.bmp
# 新标定配套模板（若现场有单独文件可覆盖）：Scanner_Template_20260806/S2-Scanner_Template_sample.txt
template_points = third_party/LB/S2_Scanner_Template_20260717.txt

[GeoHash]
# 刚性距离角度约束：扫描仪上标记点相对距离和角度不变（建表、查询、投票、识别）
# angle_tolerance_deg 角度最大偏差，单位度
# length_tolerance 长度最大偏差，单位mm
# min_percent 最低票数占比，占所有查询数量的百分比
angle_tolerance_deg = 2.0
length_tolerance = 0.5
min_percent = 0.5
# 扫描头上标记点最大间距、最小有效距离（低于最小距离的点不进行特征计算和查询）
max_distance = 650.0
min_distance = 30.0
# 左上角 3x3 是旋转矩阵，右侧一列是平移。
