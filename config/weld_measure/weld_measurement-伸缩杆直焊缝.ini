[Measurement]
max_fit_error_mm=0.20
toe_location_error_mm=0.50

[Undercut]
# 多截面咬边长度计算用的截面间隔，单截面咬边深度计算不使用该参数
section_interval_mm=5.0
# 咬边判定阈值，单截面最大咬边深度大于等于该值时认为该截面存在咬边
depth_threshold_mm=0.50
# 多截面咬边长度判定时使用的中值滤波窗口，单截面咬边深度计算不使用该参数
median_filter_window=3
# 焊趾附近咬边搜索半宽度，以识别焊趾为中心，内外两侧都在该范围内搜索咬边凹槽
toe_search_width_mm=2.0
# 母材基准线拟合起点，避开焊趾附近咬边凹槽，防止凹槽拉偏基准线
base_fit_start_from_toe_mm=2.0
# 母材基准线拟合终点，使用距焊趾该距离以内的外侧母材点拟合基准线
base_fit_end_from_toe_mm=15.0
# 有效咬边凹槽的最小连续宽度，小于该宽度的局部噪声不计入咬边深度
min_groove_width_mm=0.5
# 有效咬边凹槽的最少连续下凹点数，小于该点数的孤立低点不计入咬边深度
min_groove_points=3

[ONNX]
enabled=true
# 相对本 ini（config/weld_measure/）解析到 exe 旁 models/weld_measure/
model_path=../../models/weld_measure/pointnet_weld_seam_V7.3_good.onnx
input_raw_name=input_raw
input_smooth_name=input_smooth
output_name=output_segmentation
target_point_count=512
median_filter_window=7
seam_class_id=1
num_classes=3
min_seam_points=3

[Input]
frame_count=7
# 起始帧号从 1 开始。first 用 TemplateFirst，last 用 TemplateLast，其余用 TemplateMiddle。
first_template_frame=1
last_template_frame=7

# 路径相对本 ini 所在目录（config/weld_measure/）。向量格式 (x,y,z)。
[TemplateFirst]
template_pcd_path=Data/path1/Template_Path1_Telescopic_cloud_1.pcd
axis=(-0.9993,0.0099,-0.0354)
center=(245.2336,-60.3816,-56.5169)
section_dist=2.0
section_width=2.0
section_leng=100.0
section_height=100.0
start_sec=(-287.3047,16.8570,508.6308)
end_sec=(221.8584,11.4472,526.4359)

[TemplateMiddle]
template_pcd_path=Data/path1/Template_Path1_Telescopic_cloud_4.pcd
axis=(-0.9993,0.0101,-0.0355)
center=(244.8971,-60.5478,-64.3553)
section_dist=2.0
section_width=2.0
section_leng=100.0
section_height=100.0
start_sec=(221.2663,9.9735,521.7745)
end_sec=(-284.4616,16.2487,503.5976)

[TemplateLast]
template_pcd_path=Data/path1/Template_Path1_Telescopic_cloud_7.pcd
axis=(-0.9993,0.0132,-0.0354)
center=(241.2171,-59.1926,-57.3472)
section_dist=2.0
section_width=2.0
section_leng=100.0
section_height=100.0
start_sec=(222.1438,9.9310,519.5475)
end_sec=(-6.4243,8.8981,512.5299)

# 在线测量时 scan 点云由工位内存传入；此处占位以满足 frame_count 校验。
[Frame1]
scan_pcd_path=Data/path1/Scan_Path1_Telescopic_cloud_1.pcd
[Frame2]
