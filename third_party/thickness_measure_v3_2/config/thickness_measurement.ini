# 文件编码 UTF-8。# 后内容为中文注释。

[Input]
# 可填写单个 PCD 文件或包含多份 PCD 的目录；内外文件按文件名排序后逐一配对。
# 注意：外部扫描点云是指有外部焊缝的扫描点云，不是内部焊缝
outer_template_cloud_path=..\Data\Template_Path4_Arm_cloud_stitched_1_sample.pcd
#inner_scan_input_path=..\Data\7_Path4_Arm_cloud_stitched_inner.pcd
#outer_scan_input_path=..\Data\7_Path4_Arm_cloud_stitched_outter.pcd
inner_scan_input_path=..\Data\11_Path4_Arm_cloud_stitched_inner.pcd
outer_scan_input_path=..\Data\11_Path4_Arm_cloud_stitched_outter.pcd

[DynamicSections]
enabled=true
axis_point=(-912.4816,-357.8219,3348.3134)
axis_direction=(0.6960,-0.4671,0.5453)
reference_point=(-936.650024,305.256409,2722.577393)
# 从参考投影点到最近源点投影点的方向上，正值偏移
section_offset_1_mm=30.0
section_offset_2_mm=60.0
section_half_width_mm=150.0
section_thickness_mm=1.5
center_point_1=(-495.215424,-4.684036,3066.045166)
center_point_2=(-309.695404,-120.532257,3215.445068)

# 第二组输入：内表面、外表面和该组专用外模板。填写后启用第二组测量。
[Input2]
outer_template_cloud_path=..\Data\Template_Path4_Arm_cloud_stitched_12_sample.pcd
#inner_scan_input_path=..\Data\14_Path4_Arm_cloud_stitched_inner.pcd
#outer_scan_input_path=..\Data\14_Path4_Arm_cloud_stitched_outter.pcd
inner_scan_input_path=..\Data\12_Path4_Arm_cloud_stitched_inner.pcd
outer_scan_input_path=..\Data\12_Path4_Arm_cloud_stitched_outter.pcd

[DynamicSections2]
enabled=true
# 请填写 Template_Path4_Arm_cloud_stitched_12_sample.pcd 对应的轴线
axis_point=(-125.3787, -283.2391, 3342.9138)
axis_direction=(0.0326, 0.6934, -0.7198)
reference_point=(-683.993103, 69.643288, 2955.781250)
section_offset_1_mm=30.0
section_offset_2_mm=60.0
section_half_width_mm=150.0
section_thickness_mm=1.5
center_point_1=(-726.182373,-155.593552,3198.762695)
center_point_2=(-729.718262,-224.059143,3266.466553)

[Preprocess]
# 仅用于 ICP 求解，不能用于最终厚度最近邻查询。
enable_outlier_removal=false
mean_k=10
stddev_mul_thresh=5.0
enable_voxel_downsample=true
leaf_size_mm=1.5

[InnerOuterICP]
# 内表面(源)到外表面(目标)的坡口精细匹配。
max_iterations=15
max_correspondence_distance_mm=1.5
transformation_epsilon=0.001
euclidean_fitness_epsilon=0.001

[OuterTemplateICP]
# 外表面(源)到外模板(目标)的全局匹配；与内外精细 ICP 分开配置。
max_iterations=100
max_correspondence_distance_mm=100.0
transformation_epsilon=0.001
euclidean_fitness_epsilon=0.001

[ONNX]
enabled=true
model_path=..\Data\pointnet_weld_seam_V8.2_good.onnx
input_feature_name=input_15d_features
output_name=output_segmentation
target_point_count=512
median_filter_window=15
detrend_filter_window=45
fixed_physical_scale_mm=150.0
slope_radius_mm=1.0
fine_curvature_radius_mm=2.5
macro_curvature_radius_mm=6.0
continuity_window=7
seam_class_id=1
num_classes=3
min_seam_points=3

[FallbackFeatures]
# 所有截面焊趾识别失败时，使用这些模板坐标系特征点回退计算厚度。
feature_count=2
point1=(-483.128296,31.429688,3142.536377)
point2=(-467.313965,-39.799164,3066.436523)

[InnerOuterICP2]
# 第二组内表面(源)到外表面(目标)的匹配参数。
max_iterations=15
max_correspondence_distance_mm=1.5
transformation_epsilon=0.000001
euclidean_fitness_epsilon=0.000001
# 仅用于第二组 point-to-plane ICP：筛除边缘/不稳定点后平滑保留法向量。
normal_k=20
max_curvature=0.03
min_planarity=0.55
normal_smoothing_k=12
normal_smoothing_angle_deg=25.0
min_reliable_point_count=100

[FallbackFeatures2]
feature_count=2
point1= (-722.491943,-202.410751,3159.555420)
point2= (-726.359192,-158.731384,3202.736328)
