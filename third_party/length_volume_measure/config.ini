// Length and volume measurement configuration.
// All dimensions use the same unit as the point cloud.

[Input]
inputCloud = ./Data/sample_cylinder_cut.pcd
// Crop input cloud by XYZ bounding box before measurement.
cropInputCloud = false
cropMin = -100000, -100000, -100000
cropMax = 100000, 100000, 100000

[Template]
templateCloud = ./Data/sample_cylinder.pcd
// Initial/reference cylinder axis direction in the template coordinate system.
axisDirection = 0, 0, 1
// Any representative 3D point on each template end face.
endPoint1 = -24.047901,599.578979,3.182239
endPoint2 = -50.648342,597.784058,2197.218262

[Preprocess]
voxelSize = 3.0
// Set outlierK <= 1 to disable statistical filtering.
outlierK = 10
outlierStd = 5.0

[ICP]
maxIterations = 80
maxCorrespondenceDistance = 100.0
transformationEpsilon = 1e-8
euclideanFitnessEpsilon = 1e-6

[CylinderFit]
// false: keep axisDirection fixed; true: update the axis from the fitted point cloud.
updateAxis = false
iterations = 3
// <= 0 selects an automatic radial inlier band.
inlierBand = 0

[LengthMeasurement]
// Normals are computed only on the downsampled, aligned input cloud.
normalK = 15
endNormalMinAbsDot = 0.90

// Endpoint detection: 
// outsideScan scans from both axial outsides inward; 
// templateWindow uses template endpoint windows.
endpointDetectionMethod = outsideScan

// One-dimensional axial histogram and template-end search windows.
// 每轮会筛选靠近当前圆柱表面的点，点到圆柱轴线的径向距离，和当前拟合半径的差值，如果小于等于 band，这个点就被认为是圆柱表面内点，参与下一轮拟合。
// 自动选择带宽：max(5.0f, cylinder->radius * 0.02f)，且后续每轮会逐渐收窄带宽
axialBinWidth = 2.0
// 粗搜索端点搜索范围
endSearchHalfWidth = 80.0
// outsideScan: after the first valid edge bin, search inward this width and use the max-density bin.
outsideScanPeakSearchWidth = 20.0
// 沿着轴向的端部bin中点数最小值
minPointsPerBin = 10
// 满足最少点的连续bin的最小数量
minConsecutiveInsideBins = 3
// 左右两端：候选边界左边的 2 个 bin 要低于 minPointsPerBin
outsideCheckBins = 2

// Raw cloud is scanned once and only points in these narrow windows are retained.
// 精细提取端点变化范围
refineHalfWidth = 6.0
// 精细端点定位阶段用的边缘分位数参数,
// 左端取候选点轴向坐标的 0.1% 分位数
// 右端取候选点轴向坐标的 99.9% 分位数
refineEdgePercentile = 0.0001

// Maximum radial distance accepted during raw refinement. <= 0 uses 1.25 * fitted radius.
// 精细端点定位时的径向过滤阈值,
// 只保留距离圆柱轴线不太远的点参与端点精定位，太远的点认为是背景、杂点、夹具、环境点，直接丢掉。
endpointMaxRadius = 0
